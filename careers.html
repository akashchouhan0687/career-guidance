<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Explorer | CareerGuide</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .explorer-header { padding: 2.5rem 0 1.5rem; text-align: center; background: var(--bg-white); border-bottom: 1px solid var(--border); }
        .explorer-header h1 { font-size: 2rem; margin-bottom: 0.4rem; }
        .explorer-header p { font-size: 1rem; margin-bottom: 0; }
        .search-container { max-width: 520px; margin: 0 auto 1.25rem; }
        .search-input { width: 100%; padding: 0.65rem 1rem; border-radius: var(--radius); border: 1px solid var(--border); font-size: 0.95rem; outline: none; background: var(--bg-white); }
        .search-input:focus { border-color: var(--accent); }
        .filters { display: flex; gap: 0.4rem; justify-content: center; flex-wrap: wrap; margin-bottom: 2rem; }
        .filter-btn { padding: 0.4rem 0.85rem; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg-white); cursor: pointer; font-size: 0.85rem; font-weight: 500; color: var(--text-muted); }
        .filter-btn:hover { border-color: var(--border-hover); color: var(--primary); }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        
        /* Details View */
        .details-header { margin-bottom: 1.5rem; }
        .back-btn { margin-bottom: 1.5rem; display: inline-flex; align-items: center; gap: 0.4rem; color: var(--text-muted); font-size: 0.9rem; font-weight: 500; }
        .back-btn:hover { color: var(--primary); }
        .details-content { background: var(--bg-white); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; }
        .details-section { margin-top: 2rem; }
        .details-section h3 { font-size: 1.15rem; margin-bottom: 0.75rem; border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; }
        .skills-list { display: flex; gap: 0.4rem; flex-wrap: wrap; }
        .skill-tag { background: var(--bg-light); border: 1px solid var(--border); padding: 0.2rem 0.6rem; border-radius: var(--radius); font-size: 0.85rem; color: var(--text-main); }
        .roadmap-list { list-style: none; padding: 0; }
        .roadmap-list li { padding: 0.75rem 0; border-bottom: 1px solid var(--border); position: relative; padding-left: 1.75rem; font-size: 0.95rem; }
        .roadmap-list li::before { content: ''; position: absolute; left: 0; top: 1.15rem; width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
        .roadmap-list li:last-child { border-bottom: none; }
        
        .no-results { text-align: center; padding: 2.5rem; color: var(--text-muted); grid-column: 1 / -1; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">CareerGuide</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="careers.html" class="active">Careers</a>
                <a href="assessment.html">Assessment</a>
                <a href="roadmaps.html">Roadmaps</a>
                <a href="resources.html">Resources</a>
                <a href="login.html">Login</a>
            </div>
            <a href="assessment.html" class="btn btn-primary nav-cta">Take Assessment</a>
            <button class="mobile-menu-btn" aria-label="Toggle Menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
            </button>
        </div>
    </nav>

    <div id="explorer-view">
        <header class="explorer-header">
            <div class="container">
                <h1>Explore Careers</h1>
                <p>Discover different career paths, required skills, and learning opportunities.</p>
            </div>
        </header>

        <section class="container" style="padding-top: 2rem;">
            <div class="search-container">
                <input type="text" id="search-input" class="search-input" placeholder="Search careers, skills, or categories...">
            </div>
            <div class="filters" id="filters-container">
                <!-- Filled by JS -->
            </div>
            <div class="grid grid-3" id="careers-grid">
                <!-- Filled by JS -->
            </div>
        </section>
    </div>

    <div id="details-view" style="display: none; padding: 4rem 0;">
        <div class="container">
            <a href="#" id="back-btn" class="back-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Back to Careers
            </a>
            <div id="career-details-content" class="details-content">
                <!-- Filled by JS -->
            </div>
            
            <div class="details-section">
                <h3>Related Careers</h3>
                <div class="grid grid-3" id="related-careers-grid">
                    <!-- Filled by JS -->
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <a href="index.html" class="footer-logo">CareerGuide</a>
            <p>Helping students explore career possibilities.</p>
        </div>

    </footer>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/careers.js"></script>
</body>
</html>
