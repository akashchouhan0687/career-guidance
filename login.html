<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CareerGuide</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <a href="index.html" class="auth-brand">
                <img src="images/logo-icon.png" alt="CareerGuide" width="44" height="38" class="logo-icon">
                <span>Career<span class="logo-accent">Guide</span></span>
            </a>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Login to continue your career journey.</p>
        </div>
        
        <div id="auth-notice" class="auth-notice" style="display: none;"></div>

        <form class="auth-form" id="login-form">
            <div id="login-error" class="auth-error"></div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                <button type="button" class="password-toggle" id="toggle-pwd">Show</button>
            </div>
            
            <div>
                <a href="#" id="forgot-pwd-link" class="forgot-msg">Forgot Password?</a>
                <div id="forgot-pwd-msg" class="forgot-msg-text">Password recovery is not available in this demo.</div>
            </div>
            
            <button type="submit" class="auth-btn">Login</button>
        </form>
        
        <div id="logged-in-panel" class="auth-logged-in-panel" style="display: none;">
            <p class="auth-subtitle" style="margin-bottom: 1.25rem;">You are currently logged in as <strong id="logged-in-user-name"></strong>.</p>
            <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                <a href="assessment.html" class="auth-btn" style="text-align: center; text-decoration: none;">Take Career Assessment</a>
                <a href="index.html" class="auth-link" style="text-align: center; margin-top: 0.35rem;">Return to Homepage</a>
                <button type="button" id="logout-btn" class="auth-link" style="background: none; border: none; cursor: pointer; color: #dc2626; margin-top: 0.5rem; font-size: 0.875rem;">Log Out</button>
            </div>
        </div>

        <div class="auth-footer" id="auth-footer">
            Don't have an account? <a href="register.html" class="auth-link" id="register-link">Create Account</a>
        </div>
        
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
