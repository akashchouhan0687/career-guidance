<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%" aria-hidden="true">
  <defs>
    <filter id="soft-shadow" x="-8%" y="-8%" width="116%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#263449" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="soft-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5F9FF"/>
      <stop offset="100%" stop-color="#EAF2FF"/>
    </linearGradient>
  </defs>

  <!-- Background Decorative Shapes -->
  <circle cx="270" cy="190" r="165" fill="url(#soft-grad)" stroke="#E2EAF4" stroke-width="1.5"/>
  <circle cx="270" cy="190" r="125" fill="#EAF2FF" opacity="0.6"/>
  <circle cx="270" cy="190" r="85" fill="#FFFFFF" opacity="0.5"/>

  <!-- Subtle connecting dotted guideline -->
  <path d="M 140 140 Q 270 90 400 130" fill="none" stroke="#CBD8E6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M 140 240 Q 270 300 400 240" fill="none" stroke="#CBD8E6" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Left Floating Card: Assessment & Match -->
  <g filter="url(#soft-shadow)">
    <rect x="42" y="85" width="155" height="110" rx="8" fill="#FFFFFF" stroke="#E2EAF4" stroke-width="1.2"/>
    
    <!-- Header Tag -->
    <rect x="54" y="98" width="56" height="16" rx="4" fill="#EAF2FF"/>
    <text x="82" y="110" font-family="'Inter', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#3568C0" text-anchor="middle">ASSESS</text>
    
    <!-- Title -->
    <text x="54" y="132" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" fill="#263449">Career Match</text>
    <text x="175" y="132" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#3568C0" text-anchor="end">96%</text>
    
    <!-- Progress Bar -->
    <rect x="54" y="142" width="131" height="6" rx="3" fill="#E2EAF4"/>
    <rect x="54" y="142" width="125" height="6" rx="3" fill="#3568C0"/>
    
    <!-- Subtitle text lines -->
    <text x="54" y="165" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#64748B">Software Engineering</text>
    <circle cx="178" cy="162" r="6" fill="#15803D" opacity="0.15"/>
    <path d="M 175 162 L 177 164 L 181 160" fill="none" stroke="#15803D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right Floating Card: Learning Roadmap -->
  <g filter="url(#soft-shadow)">
    <rect x="345" y="75" width="155" height="120" rx="8" fill="#FFFFFF" stroke="#E2EAF4" stroke-width="1.2"/>
    
    <!-- Header Tag -->
    <rect x="357" y="88" width="48" height="16" rx="4" fill="#EAF2FF"/>
    <text x="381" y="100" font-family="'Inter', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#3568C0" text-anchor="middle">PLAN</text>
    
    <!-- Timeline Items -->
    <!-- Step 1 -->
    <circle cx="367" cy="120" r="8" fill="#3568C0"/>
    <text x="367" y="123.5" font-family="'Inter', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="383" y="123" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" fill="#263449">Fundamentals</text>
    
    <!-- Connector line -->
    <line x1="367" y1="128" x2="367" y2="138" stroke="#E2EAF4" stroke-width="1.5"/>
    
    <!-- Step 2 -->
    <circle cx="367" cy="146" r="8" fill="#EAF2FF" stroke="#3568C0" stroke-width="1.5"/>
    <text x="367" y="149.5" font-family="'Inter', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#3568C0" text-anchor="middle">2</text>
    <text x="383" y="149" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="500" fill="#263449">Core Frameworks</text>
    
    <!-- Connector line -->
    <line x1="367" y1="154" x2="367" y2="164" stroke="#E2EAF4" stroke-width="1.5"/>
    
    <!-- Step 3 -->
    <circle cx="367" cy="172" r="8" fill="#F5F9FF" stroke="#CBD8E6" stroke-width="1.5"/>
    <text x="367" y="175.5" font-family="'Inter', system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" text-anchor="middle">3</text>
    <text x="383" y="175" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748B">Real Projects</text>
  </g>

  <!-- Lower Left Icon Bubble: Technology -->
  <g filter="url(#soft-shadow)">
    <circle cx="105" cy="250" r="24" fill="#FFFFFF" stroke="#E2EAF4" stroke-width="1.2"/>
    <rect x="91" y="236" width="28" height="28" rx="6" fill="#EAF2FF"/>
    <path d="M 99 250 L 102 246 M 102 254 L 99 250 M 111 250 L 108 246 M 108 254 L 111 250 M 106 244 L 104 256" 
          stroke="#3568C0" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Lower Right Icon Bubble: Analytics & Data -->
  <g filter="url(#soft-shadow)">
    <circle cx="435" cy="245" r="24" fill="#FFFFFF" stroke="#E2EAF4" stroke-width="1.2"/>
    <rect x="421" y="231" width="28" height="28" rx="6" fill="#EAF2FF"/>
    <path d="M 427 253 L 427 246 M 432 253 L 432 241 M 437 253 L 437 237 M 442 253 L 442 243" 
          stroke="#3568C0" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Central Student Workspace Illustration -->
  <!-- Desk Base line -->
  <line x1="140" y1="332" x2="400" y2="332" stroke="#CBD8E6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Laptop Device -->
  <g filter="url(#soft-shadow)">
    <!-- Screen frame -->
    <rect x="210" y="215" width="120" height="85" rx="6" fill="#FFFFFF" stroke="#263449" stroke-width="2"/>
    <!-- Screen bezel inner -->
    <rect x="215" y="220" width="110" height="72" rx="3" fill="#F5F9FF"/>
    
    <!-- Screen UI Elements -->
    <rect x="218" y="223" width="104" height="10" rx="2" fill="#EAF2FF"/>
    <circle cx="223" cy="228" r="2" fill="#3568C0"/>
    <circle cx="229" cy="228" r="2" fill="#CBD8E6"/>
    <circle cx="235" cy="228" r="2" fill="#CBD8E6"/>
    
    <!-- Mini chart on screen -->
    <rect x="222" y="240" width="46" height="46" rx="3" fill="#FFFFFF" stroke="#E2EAF4" stroke-width="1"/>
    <rect x="226" y="268" width="6" height="14" rx="1" fill="#3568C0"/>
    <rect x="236" y="258" width="6" height="24" rx="1" fill="#3568C0"/>
    <rect x="246" y="250" width="6" height="32" rx="1" fill="#2855A5"/>
    <rect x="256" y="262" width="6" height="20" rx="1" fill="#EAF2FF"/>

    <!-- Mini text cards on screen -->
    <rect x="274" y="240" width="46" height="13" rx="2" fill="#FFFFFF" stroke="#E2EAF4" stroke-width="1"/>
    <rect x="278" y="244" width="22" height="3" rx="1" fill="#3568C0"/>
    <rect x="278" y="249" width="34" height="2" rx="1" fill="#64748B"/>

    <rect x="274" y="257" width="46" height="13" rx="2" fill="#FFFFFF" stroke="#E2EAF4" stroke-width="1"/>
    <rect x="278" y="261" width="26" height="3" rx="1" fill="#3568C0"/>
    <rect x="278" y="266" width="30" height="2" rx="1" fill="#64748B"/>

    <rect x="274" y="274" width="46" height="12" rx="2" fill="#EAF2FF"/>
    <text x="297" y="283" font-family="'Inter', system-ui, sans-serif" font-size="7" font-weight="600" fill="#3568C0" text-anchor="middle">EXPLORE</text>

    <!-- Laptop keyboard base -->
    <path d="M 195 300 L 345 300 L 355 315 L 185 315 Z" fill="#E2EAF4" stroke="#CBD8E6" stroke-width="1.5"/>
    <rect x="250" y="303" width="40" height="4" rx="2" fill="#CBD8E6"/>
  </g>

  <!-- Books & Study Mug on Desk -->
  <rect x="155" y="318" width="32" height="6" rx="1" fill="#3568C0"/>
  <rect x="152" y="324" width="38" height="8" rx="1" fill="#EAF2FF" stroke="#CBD8E6" stroke-width="1"/>
  
  <rect x="358" y="316" width="14" height="16" rx="2" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1"/>
  <path d="M 372 320 Q 377 324 372 328" fill="none" stroke="#CBD8E6" stroke-width="1.5"/>

  <!-- Top Compass / Direction Star Badge -->
  <g filter="url(#soft-shadow)">
    <circle cx="270" cy="50" r="18" fill="#FFFFFF" stroke="#E2EAF4" stroke-width="1.2"/>
    <polygon points="270,39 273,48 282,50 273,52 270,61 267,52 258,50 267,48" fill="#3568C0"/>
    <circle cx="270" cy="50" r="2.5" fill="#FFFFFF"/>
  </g>
</svg>
