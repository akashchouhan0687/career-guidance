<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CareerGuide</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <a href="index.html" class="auth-brand">CareerGuide</a>
            <h1 class="auth-title">Create Your Account</h1>
            <p class="auth-subtitle">Start exploring your career journey.</p>
        </div>
        
        <form class="auth-form" id="register-form">
            <div id="register-error" class="auth-error"></div>
            <div id="register-success" class="auth-success"></div>
            
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" class="form-control" placeholder="Enter your full name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Create a password" minlength="6" required>
                <button type="button" class="password-toggle" id="toggle-pwd">Show</button>
            </div>
            
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" class="form-control" placeholder="Confirm your password" minlength="6" required>
            </div>
            
            <button type="submit" class="auth-btn">Create Account</button>
        </form>
        
        <div class="auth-footer">
            Already have an account? <a href="login.html" class="auth-link">Login</a>
        </div>
        
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
